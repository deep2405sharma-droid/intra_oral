[TRAINING]
num_classes      = 3
# 3 classes: normal, opmd, variation — same task as resnet.ini
epochs           = 20
batch_size       = 16
# Pretrained backbone uses lower LR — same rationale as ResNet's backbone_lr
backbone_lr      = 0.00005
# Freshly initialised classifier head uses higher LR
head_lr          = 0.0005
momentum         = 0.9
weight_decay     = 0.0005
gradient_clip    = 1.0
# NOTE: same caveat as resnet.ini — train_efficientnet.py's
# train_one_epoch() hardcodes max_norm=1.0 rather than reading
# cfg.gradient_clip. Value matches for now.
val_split        = 0.15
test_split       = 0.15
# LR scheduler: cosine | step | plateau
lr_scheduler     = cosine
min_lr           = 0.000001
lr_patience      = 5
lr_factor        = 0.5
num_workers      = 2
log_every        = 10
val_every        = 1
score_threshold  = 0.50

[SAMPLER]
weighted_sampler    = False
oversample_minority = True

[MODEL]
backbone    = efficientnet_b0
# Any torchvision EfficientNet: efficientnet_b0 | b1 | b2 | b3 | b4
# b0 is the smallest/fastest — good default to compare directly against
# ResNet50's parameter count and training time before scaling up.
pretrained  = True
dropout     = 0.3
input_size  = 224,224
# NOTE: EfficientNet's official recommended input resolution scales with
# variant (b0=224, b1=240, b2=260, b3=300, b4=380) — 224,224 works for
# any variant but underutilises b1+ if you switch backbone above.

[SYSTEM]
device      = cuda
seed        = 42

[LOGGING]
save_best_model  = True
save_every_epoch = False

[PATHS]
model_dir           = /kaggle/working/intraoral_lesion/outputs/efficientnet/models
output_dir          = /kaggle/working/intraoral_lesion/outputs/efficientnet/training
infer_output_dir    = /kaggle/working/intraoral_lesion/outputs/efficientnet/inference
checkpoint_dir      = /kaggle/working/intraoral_lesion/outputs/efficientnet/checkpoint
log_file            = /kaggle/working/intra_oral/logs/intraoral_lesion.log

[DATASET]
val_split      = 0.20
random_seed    = 42
normal_dataset = BOTH

[VISUAL]
visualize_predictions = False

[STAGES]
stages = train,evaluate,inference
