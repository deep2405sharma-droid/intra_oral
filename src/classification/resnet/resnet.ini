[TRAINING]
num_classes      = 3
# 3 classes: normal, opmd, variation
epochs           = 20
batch_size       = 16
# Pretrained backbone uses lower LR — same rationale as U-Net encoder_lr
backbone_lr      = 0.00005
# Freshly initialised FC head uses higher LR
head_lr          = 0.0005
momentum         = 0.9
weight_decay     = 0.0005
gradient_clip    = 1.0
# NOTE: train_resnet.py's train_one_epoch() currently hardcodes
# max_norm=1.0 in the torch.nn.utils.clip_grad_norm_ call instead of
# reading cfg.gradient_clip. Value matches for now (1.0 == 1.0) but
# changing this key will NOT change training behaviour until that
# hardcoded 1.0 is replaced with cfg.gradient_clip.
val_split        = 0.15
# This is the val_split actually used by build_data_loaders() (cfg.val_split).
# [DATASET] below has its own separate val_split=0.20 that populates
# cfg.dataset_val_split — a different attribute, not a duplicate — and is
# restored there rather than removed, since resnet_config.py reads it
# unconditionally even though nothing downstream appears to consume it.
test_split       = 0.15
# NOT read anywhere in train_resnet.py — no three-way split exists in this
# pipeline. Kept only because resnet_config.py reads it into cfg.test_split
# (harmless if omitted — becomes None — but restored for a real value here).
# LR scheduler: cosine | step | plateau
lr_scheduler     = cosine
min_lr           = 0.000001
lr_patience      = 5
lr_factor        = 0.5
num_workers      = 2
log_every        = 10
val_every        = 1
# score_threshold: NOT currently read anywhere in train_resnet.py /
# resnet_builder.py — no thresholding logic exists in this pipeline.
# Kept here only in case a future evaluate/inference stage needs it.
score_threshold  = 0.50
# class_weights: the actual CLASS_WEIGHTS list is still hardcoded in
# resnet_builder.py (CLASS_WEIGHTS = [1.0, 8.0, 5.0]), NOT read from
# here. Added as a placeholder — wire this into resnet_builder.py /
# train_resnet.py if you want weight tuning without editing source.
# class_weights  = 1.0,8.0,5.0

[SAMPLER]
# Only weighted_sampler is actually read by resnet_builder.build_data_loaders().
weighted_sampler    = False
# oversample_minority: NOT read anywhere in resnet_builder.py — only
# weighted_sampler actually gates the WeightedRandomSampler. This key still
# populates cfg.oversample_minority (unused downstream), restored for a
# real value rather than left as None. Its True/False here has no effect
# on training — wire it in or delete it once you've decided which lever
# (this or weighted_sampler) should actually control oversampling.
oversample_minority = True

[MODEL]
backbone    = resnet50
# Any torchvision ResNet: resnet18 | resnet34 | resnet50 | resnet101
pretrained  = True
# True → load ImageNet weights; backbone fine-tuned with backbone_lr
dropout     = 0.3
# Dropout before the FC head to reduce overfitting
input_size  = 224,224
# Standard ImageNet input size for ResNet

[SYSTEM]
device      = cuda
seed        = 42
# This is the seed actually used by build_data_loaders() (cfg.seed).
# [DATASET] below has its own separate random_seed=42 that populates
# cfg.random_seed — a different attribute, restored below rather than
# removed, for the same reason as [DATASET] val_split above.

[LOGGING]
# save_best_model / save_every_epoch: NOT read anywhere in train_resnet.py.
# Checkpointing is currently hardcoded: last.pth saved every epoch
# unconditionally, best.pth saved whenever val_macro_f1 improves.
save_best_model  = True
save_every_epoch = False

[PATHS]
model_dir           = /kaggle/working/intraoral_lesion/outputs/resnet/models
output_dir          = /kaggle/working/intraoral_lesion/outputs/resnet/training
infer_output_dir    = /kaggle/working/intraoral_lesion/outputs/resnet/inference
checkpoint_dir      = /kaggle/working/intraoral_lesion/outputs/resnet/checkpoint
log_file            = /kaggle/working/intra_oral/logs/intraoral_lesion.log

[DATASET]
val_split      = 0.20
random_seed    = 42
# Both populate cfg.dataset_val_split / cfg.random_seed — separate
# attributes from [TRAINING] val_split / [SYSTEM] seed above (which are
# what build_data_loaders() actually uses). Neither of these two appears
# to be read downstream, but resnet_config.py parses them unconditionally,
# so kept with real values rather than left as None.
# Which dataset provides Normal class images
# Options: SMART_II | SMART_OM | BOTH
normal_dataset = BOTH
# NOTE: unlike U-Net's get_dataset_path(), the ResNet get_dataset_path()
# does NOT branch on normal_dataset — it always merges both sources
# regardless of this setting. Changing this currently has no effect on
# the ResNet pipeline until that function is updated to check it.

[VISUAL]
# visualize_predictions: NOT read anywhere in train_resnet.py.
visualize_predictions = False

[STAGES]
# stages: NOT read anywhere — train_resnet.py's __main__ always runs
# get_dataset_path() + train() unconditionally, regardless of this list.
stages = train,evaluate,inference

# ══════════════════════════════════════════════════════════════════════
# Pipeline B — U-Net-masked ResNet classifier
# ══════════════════════════════════════════════════════════════════════
[CLASSIFICATION-RESNET-MASKED]
masked.output.dir  = /kaggle/working/intraoral_lesion/data/resnet_masked/images
masked.dataset.csv = /kaggle/working/intraoral_lesion/data/resnet_masked/resnet_masked_train.csv
# Minimum rasterised lesion pixel count to count as a real annotation —
# mirrors unet.ini's [DATASET] min_area. Optional (defaults to 500 if
# omitted, since resnet_config.py doesn't read this section directly —
# precompute_masked_dataset.py reads it with a safe fallback).
min_area           = 500

# resnet.config for Pipeline B — points back at THIS file by default so
# Pipeline B trains with the same architecture/LR/epochs as Pipeline A.
# Point this at a separate .ini instead if you want Pipeline B to use
# different hyperparameters or a separate checkpoint_dir/output_dir.
resnet.config      = /kaggle/working/intra_oral/src/classification/resnet/resnet.ini

# NOTE: unet.checkpoint / unet.encoder / unet.decoder_channels /
# unet.target_size / device are no longer needed here — masks are built
# directly from existing coco_file ground-truth annotations via
# precompute_masked_dataset.py, not by running U-Net inference. Keep
# unet_inference.py around anyway: it's still the right tool if you later
# need to mask brand-new images with no ground-truth annotation (e.g. at
# real deployment/inference time on unseen patients).